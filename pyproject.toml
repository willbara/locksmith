[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "locksmith"
dynamic = ["version"]
description = "Minimalist desktop app to encrypt, decrypt and share files"
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.8",
    "cryptography>=48",  # first release whose OpenSSL wheels have ML-KEM and ML-DSA
    "segno>=1.6",
    "bcrypt>=4.1",       # opens passphrase-protected OpenSSH private keys (bcrypt-pbkdf)
    "backports.zstd>=1.0; python_version < '3.14'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller>=6.10"]

[project.gui-scripts]
locksmith = "locksmith.app:main"

[tool.setuptools.dynamic]
version = { attr = "locksmith.__version__" }

[tool.setuptools.packages.find]
include = ["locksmith*"]

[tool.setuptools.package-data]
locksmith = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "W6", "I", "B", "UP"]
